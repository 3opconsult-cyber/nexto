<meta name="claude:viewport-fit-sides" content="cover">
<title>%%TITLE%%</title>
<style>
%%FONTS%%
  /* Lecteur sombre, comme /animation : la scène 9:16 à gauche, le scénario à droite (empilé sur mobile). */
  :root{
    --night:#0B1F27; --panel:#12303B; --line:#1E4250;
    --teal:#12B39C; --green:#2FD06E; --gold:#F2A93B;
    --text:#EEF4F3; --soft:#9DB4BC;
    --display:'Quicksand', 'Trebuchet MS', sans-serif;
    --body:'Inter', system-ui, sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--night); color:var(--text);}
  body{font-family:var(--body); margin:0; padding-block:28px 40px;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
  .layout{max-width:1000px; margin:0 auto; display:grid; grid-template-columns:minmax(0, 420px) minmax(0,1fr); gap:36px; align-items:start;}
  .player{display:flex; flex-direction:column; gap:12px; min-width:0;}
  .stage{width:100%; aspect-ratio:9/16; max-height:80vh; margin:0 auto; border-radius:22px; overflow:hidden; background:#000; box-shadow:0 20px 60px rgba(0,0,0,.45);}
  .stage svg{display:block; width:100%; height:100%;}
  .controls{display:flex; align-items:center; gap:10px;}
  .controls button{flex-shrink:0; border:none; border-radius:999px; background:var(--teal); color:#fff; font-family:var(--display); font-weight:700; font-size:13px; padding:9px 16px; cursor:pointer;}
  .controls button.ghost{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line); color:var(--text);}
  .controls button:focus-visible, .scenes button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .controls input[type=range]{flex:1; min-width:0; accent-color:var(--teal);}
  .controls .time{font-size:12px; color:var(--soft); font-variant-numeric:tabular-nums; width:42px; text-align:right;}
  .side{min-width:0;}
  .side .eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--teal);}
  .side h1{font-family:var(--display); font-weight:700; font-size:26px; margin:6px 0 8px; text-wrap:balance;}
  .side p.lead{font-size:13.5px; color:var(--soft); line-height:1.6; margin:0 0 20px; max-width:56ch;}
  .scenes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .scenes button{width:100%; display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; align-items:start; text-align:left; background:var(--panel); border:none; border-radius:14px; padding:12px 14px; color:var(--text); cursor:pointer; font:inherit;}
  .scenes button.on{box-shadow:inset 0 0 0 1.5px var(--teal);}
  .scenes .tc{font-size:11.5px; font-weight:600; color:var(--teal); font-variant-numeric:tabular-nums; padding-top:2px;}
  .scenes b{display:block; font-family:var(--display); font-size:14.5px; margin-bottom:2px;}
  .scenes span.d{font-size:12.5px; color:var(--soft); line-height:1.5;}
  .foot{margin-top:18px; font-size:12px; color:var(--soft); line-height:1.6;}
  .foot a{color:var(--teal); font-weight:600;}
  @media (max-width:760px){ .layout{grid-template-columns:minmax(0,1fr);} .stage{max-height:none;} }
  /* Mode capture vidéo : seule la scène, au pixel. */
  /* Bouton « Je m'inscris » : HTML hors du canevas SVG, visible quand la scène finale (QR) est à l'écran. Masqué à l'enregistrement MP4. */
  .stage{position:relative;}
  .cta-wrap{position:absolute; left:0; right:0; bottom:3.4%; display:none; flex-direction:column; align-items:center; gap:2.2%; padding:0 6%;}
  .cta-wrap.on{display:flex;}
  .signup-cta{display:flex; align-items:center; justify-content:center; width:100%; max-width:380px; background:var(--teal); color:#fff; text-decoration:none; font-family:var(--display); font-weight:700; font-size:clamp(14px,4.2vw,18px); padding:13px 20px; border-radius:999px; box-shadow:0 8px 22px rgba(0,0,0,.35); white-space:nowrap;}
  .signup-cta.alt{background:#fff; color:#123644;}
  .signup-cta:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  body.rec .cta-wrap{display:none !important;}
  body.rec{padding:0; background:#000;}
  body.rec .layout{display:block; max-width:none;}
  body.rec .side, body.rec .controls{display:none;}
  body.rec .stage{width:540px; height:960px; max-height:none; border-radius:0; box-shadow:none;}
%%PLAYER_CSS%%</style>

<div class="layout">

        <g id="args" opacity="0"><rect width="540" height="960" fill="#123644"/><g id="argRings" fill="none" stroke="#12B39C"></g></g>

          <text id="e5" x="270" y="698" text-anchor="middle" font-family="Inter" font-weight="600" font-size="16" fill="#2FD06E">nexto-eta.vercel.app/l/ins</text>
        </g>

%%CTA%%    </div>

%%SIDE%%</div>

<script>
(function(){
  var DUR = 69.5;
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, attrs, parent){ var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function clamp(x,a,b){ a = a==null?0:a; b = b==null?1:b; return Math.max(a, Math.min(b, x)); }
  function seg(t,a,b){ return clamp((t-a)/(b-a)); }
  function eio(x){ return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
  function eout(x){ return 1-Math.pow(1-x,3); }
  function back(x){ var c1=1.70158, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }
  function win(t,a,b,f){ f = f||.3; return Math.min(seg(t,a,a+f), 1-seg(t,b-f,b)); }
  function show(n, o){ n.setAttribute('opacity', clamp(o).toFixed(3)); }
  function tr(n, s){ n.setAttribute('transform', s); }
  function mod(a,n){ return ((a%n)+n)%n; }
  function hhmm(m){ var h = Math.floor(m/60), mm = Math.round(m%60); if (mm===60){h++;mm=0;} return h+':'+(mm<10?'0':'')+mm; }
  // scale autour d'un point
  function sc(n, k, cx, cy){ tr(n, 'translate('+cx+','+cy+') scale('+k.toFixed(3)+') translate('+(-cx)+','+(-cy)+')'); }

  // ---------- texte, cartes, pictogrammes ----------
  function tx(p, x, y, s, o){
    o = o || {};
    var n = el('text', {x:x, y:y, 'font-family': o.f === 'Q' ? 'Quicksand' : 'Inter', 'font-weight': o.w || (o.f === 'Q' ? 700 : 400),
      'font-size': o.s || 13, fill: o.c || '#123644'}, p);
    if (o.a) n.setAttribute('text-anchor', o.a);
    if (o.it) n.setAttribute('font-style', 'italic');
    if (o.ls) n.setAttribute('letter-spacing', o.ls);
    n.textContent = s; return n;
  }
  function box(p, x, y, w, h, o){ o = o || {};
    var a = {x:x, y:y, width:w, height:h, rx: o.rx == null ? 16 : o.rx, fill: o.fill || '#fff'};
    if (o.stroke !== 'none') { a.stroke = o.stroke || '#E2ECEA'; a['stroke-width'] = o.sw || 1.2; }
    if (o.dash) a['stroke-dasharray'] = o.dash;
    if (o.sh) a.filter = 'url(#shs)';
    return el('rect', a, p);
  }
  // Pictogrammes au trait sur une grille 24 × 24 (pas d'emoji : règle de Romain).
  var IC = {
    check: 'M5 12.5l4.5 4.5L19 7.5',
    chev: 'M9.5 6l6 6-6 6',
    lock: 'M6 11h12v10H6z|M8.5 11V8a3.5 3.5 0 0 1 7 0v3',
    pin: 'M12 21c-3-4-7-7.5-7-11.5a7 7 0 0 1 14 0c0 4-4 7.5-7 11.5z|M12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5',
    cal: 'M4 6h16v14H4z|M4 10h16|M8 3v5M16 3v5',
    bell: 'M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z|M10 20.5a2 2 0 0 0 4 0',
    chart: 'M4 19h16|M7 16v-5|M12 16V7|M17 16v-8',
    idc: 'M3 6h18v12H3z|M7 14.5c.6-1.4 1.8-2 3-2s2.4.6 3 2|M10 11a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6|M15 10h3M15 13h2',
    bank: 'M3 9l9-5 9 5|M5 10v7M9.5 10v7M14.5 10v7M19 10v7|M3 20h18',

  };
  function icon(p, name, cx, cy, s, c, w){
    s = s || 1; var g = el('g', {transform:'translate('+(cx-12*s)+','+(cy-12*s)+') scale('+s+')', fill:'none', stroke: c || '#0C8F7E',
      'stroke-width': w || 1.9, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, p);
    IC[name].split('|').forEach(function(d){ el('path', {d:d}, g); });
    return g;
  }
  var STAR = 'M0 -13 L3.8 -4.2 L13 -4 L5.8 2 L8 11.5 L0 6.2 L-8 11.5 L-5.8 2 L-13 -4 L-3.8 -4.2 Z';
  function starRow(p, cx, cy, k){
    var out = [];
    for (var i = 0; i < 5; i++){ var g = el('g', {transform:'translate('+(cx + (i-2)*32)+','+cy+') scale('+k+')'}, p);
      el('path', {d:STAR, fill:'#E2ECEA'}, g); out.push(el('path', {d:STAR, fill:'#F2A93B'}, g)); }
    return out;
  }
  function header(p, title, sub){
    el('rect', {x:12, y:12, width:316, height:82, fill:'#fff'}, p);
    el('rect', {x:12, y:93, width:316, height:1, fill:'#E2ECEA'}, p);
    tx(p, 40, 36, '9:41', {s:11.5, w:600});
    tx(p, 170, sub ? 64 : 70, title, {f:'Q', s:18, a:'middle'});

  }
  function chip(p, x, y, label, o){
    o = o || {}; var w = o.w || (label.length * 6.4 + 20);
    var g = el('g', {}, p);
    var r = el('rect', {x:x, y:y, width:w, height: o.h || 22, rx: (o.h || 22)/2, fill: o.fill || '#DDF5F0'}, g);

    g.r = r; g.t = t; g.w = w; return g;
  }
  function btn(p, cx, cy, w, h, label, o){
    o = o || {}; var g = el('g', {}, p);

    if (o.stroke) { r.setAttribute('stroke', o.stroke); r.setAttribute('stroke-width', 1.6); }
    var t = tx(g, cx, cy + 5, label, {f:'Q', s: o.s || 15, c: o.c || '#fff', a:'middle'});

  }

  // ---------- variante : « PING en 1 minute » (/animation-ping), tout à la suite, inchangée ----------
  var VAR = {
    label: function(t){ return t < 20.2 ? 'PING · L’application' : (t < 30.8 ? 'PING · Je cherche un prestataire' : 'PING · Je suis prestataire'); }
  };
  /* RUBRIQUES (ordre figé : ?scene=N sur /animation-ping, N = rang ci-dessous ; ne pas réordonner, /aide s'y réfère).
     Tableau de référence : var UI plus bas. Contrat d'URL du lecteur (brand/anim/player.js) :
     ?admin=1 panneau scénario · ?embed=1 lecteur seul + rubriques repliables (postMessage {ping:'anim-ended'} à la fin)
     · ?scene=N démarre au début de la rubrique N · ?autoplay=0 démarre en pause · ?speed=0.75|0.85|1.
      1. Accroche  (à 0 s)
      2. La carte  (à 4.6 s)
      3. Le chat et le prix  (à 10.8 s)
      4. Agenda et facture  (à 14.8 s)
      5. Je cherche un prestataire  (à 20.2 s)
      6. Je suis prestataire  (à 30.8 s)
      7. Moins de factures, plus de services  (à 43.2 s)

      9. Moins d’administratif, plus de productif  (à 49.2 s)
     10. QR de sécurité : l’heure fait foi  (à 52.2 s)
     11. Prestataires et clients se notent  (à 55.2 s)
     12. Service litige  (à 58.2 s)
     13. Paiement sécurisé sous séquestre  (à 61.2 s)
     14. Final  (à 64.2 s)
  */

  var QRN = %%QR_N%%;
  IC.mail = 'M3 5h18v14H3z|M3 7l9 6 9-6';
  IC.search = 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14|M16.5 16.5L21 21';
  IC.link = 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1|M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1';

  IC.qr = 'M4 4h6v6H4z|M14 4h6v6h-6z|M4 14h6v6H4z|M14 14h2.5v2.5H14z|M18 14h2v2|M14 19h2M18 18.5h2v1.5h-3';
  IC.star = 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z';
  IC.shield = 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z|M8.5 12l2.5 2.5L16 9.5';

  var NAVY = '#123644', TEAL = '#12B39C', INK = '#123644', GREY = '#4E6470', ORANGE = '#E8743B', GOLD = '#F2A93B';

  function bgNavy(g){ return el('rect', {x:12, y:12, width:316, height:656, fill:NAVY}, g); }

    return {r:r, t:t, full:val, a:o.a, b:o.b, y:y};
  }
  function typing(f, t){
    if (!f || f.a == null) return;
    var k = seg(t, f.a, f.b), n = Math.floor(f.full.length * k + 0.0001);

  function row(g, y, label, sub, o){
    o = o || {};

  // ---------- carte (particulier) : même dessin pour la présentation et le tuto ----------
  function buildMap(g, o){
