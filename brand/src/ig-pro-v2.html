<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../print.css">
<style>
/* Variante claire, meme logique que ig-particulier-v2 : device + echo radar
   + QR reel. Le couple sombre/clair reste la paire visuelle voulue dans le
   fil Instagram. */
:root{--M:86px;--U:43px}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--paper)}
.sheet{width:1080px;height:1350px;background:var(--paper);color:var(--ink);position:relative}
.badge{display:inline-flex;align-items:center;gap:12px;background:rgba(18,179,156,.10);border:1px solid rgba(18,179,156,.3);color:var(--tealD);font-family:var(--fb);font-weight:600;font-size:20px;letter-spacing:.02em;padding:11px 24px;border-radius:999px}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(47,208,110,.2)}
.stage{position:relative;height:430px;margin-top:8px}
.pulse{position:absolute;border-radius:50%;border:2px solid rgba(18,179,156,.32)}
.pulse.p1{width:260px;height:260px;left:6px;bottom:-70px;opacity:.55}
.pulse.p2{width:390px;height:390px;left:-59px;bottom:-135px;opacity:.32}
.pulse.p3{width:520px;height:520px;left:-124px;bottom:-200px;opacity:.16}
.stage .device{position:absolute;left:0;bottom:0}
.q{font-family:var(--fh);font-weight:700;font-size:64px;line-height:1.15;letter-spacing:-.02em;max-width:920px;margin-top:56px}
.tags{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.tags span{font-size:19px;color:var(--slate);background:#fff;border:1px solid var(--line);padding:9px 20px;border-radius:999px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:36px}
.foot .fl{max-width:640px}
.foot .url{font-family:var(--fh);font-weight:700;font-size:29px;color:var(--ink)}
.foot .hint{font-size:18px;color:var(--slate);margin-top:8px;line-height:1.4}
.qrcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;flex-shrink:0}
</style></head><body>

<section class="sheet">
  {{MARK 40px}}
  <div class="u1"></div>
  <div class="badge"><span class="dot"></span>Devenez visible en 5 minutes</div>

  <div class="stage">
    <div class="pulse p3"></div>
    <div class="pulse p2"></div>
    <div class="pulse p1"></div>
    <div class="device">{{DEVICE 340px|#123644|#12B39C}}</div>
  </div>

  <div class="q">Un service à proposer&nbsp;?<br>Soyez vu, juste à côté.</div>
  <div class="tags"><span>Ménage</span><span>Repassage</span><span>Nettoyage</span></div>

  <div class="grow"></div>
  <hr class="rule">
  <div class="u1"></div>
  <div class="foot">
    <div class="fl">
      <div class="url">nexto-eta.vercel.app</div>
      <div class="hint">Scannez — créez votre fiche prestataire.</div>
    </div>
    <div class="qrcard">{{QR igp|118px}}</div>
  </div>
</section>

</body></html>
