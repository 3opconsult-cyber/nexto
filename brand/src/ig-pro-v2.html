<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../print.css">
<style>
/* v6 — passage au format carré (1080x1080), même raison que
   ig-particulier-v2 : éviter le recadrage bas observé côté aperçu chat. */
:root{--M:86px;--U:43px}
html,body{width:1080px;height:1080px;overflow:hidden;background:var(--paper)}
.sheet{width:1080px;height:1080px;background:var(--paper);color:var(--ink);position:relative}
.stage{position:relative;height:360px;margin-top:calc(var(--U)*.9)}
.pulse{position:absolute;border-radius:50%;border:2px solid rgba(18,179,156,.32)}
.pulse.p1{width:220px;height:220px;left:10px;bottom:-62px;opacity:.55}
.pulse.p2{width:330px;height:330px;left:-46px;bottom:-117px;opacity:.32}
.pulse.p3{width:440px;height:440px;left:-101px;bottom:-172px;opacity:.16}
.stage .device{position:absolute;left:0;bottom:0}
.q{font-family:var(--fh);font-weight:700;font-size:56px;line-height:1.18;letter-spacing:-.02em;margin-top:34px;max-width:900px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:36px}
.foot .fl{max-width:660px}
.foot .cta{font-family:var(--fh);font-weight:700;font-size:26px;color:var(--ink)}
.foot .hint{font-size:15px;color:var(--slate);margin-top:9px;line-height:1.5;letter-spacing:.01em}
.qrcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;flex-shrink:0}
</style></head><body>

<section class="sheet">
  {{MARK 40px}}

  <div class="stage">
    <div class="pulse p3"></div>
    <div class="pulse p2"></div>
    <div class="pulse p1"></div>
    <div class="device">{{DEVICE 300px|#123644|#12B39C}}</div>
  </div>

  <div class="q">Et si votre client<br>était à quelques mètres&nbsp;?</div>

  <div class="grow"></div>
  <hr class="rule">
  <div class="u1"></div>
  <div class="foot">
    <div class="fl">
      <div class="cta">→ Lien en bio</div>
      <div class="hint">Devenez visible en 5 minutes — Grasse &amp; alentours</div>
    </div>
    <div class="qrcard">{{QR igp|118px}}</div>
  </div>
</section>

</body></html>
