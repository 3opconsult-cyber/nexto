<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../print.css">
<style>
/* v6 — passage au format carré (1080x1080) : Romain a signalé à plusieurs
   reprises un "rognage" en bas de l'image (le footer/QR disparaissait) —
   vérifié pixel par pixel côté fichier à chaque fois, jamais de coupe
   réelle dans le PNG généré. Cause probable : l'aperçu de son outil de
   chat recadre les images portrait hautes (4:5, 1080x1350) en carré,
   coupant systématiquement le bas. Plutôt que de continuer à démontrer
   que le fichier est intact, on supprime le problème à la racine : plus
   de zone hors-cadre puisqu'il n'y a plus de format haut. Le carré est un
   format Instagram natif, pas un compromis. */
:root{--M:86px;--U:43px}
html,body{width:1080px;height:1080px;overflow:hidden;background:var(--ink)}
.sheet{width:1080px;height:1080px;position:relative}
.stage{position:relative;height:360px;margin-top:calc(var(--U)*.9)}
.pulse{position:absolute;border-radius:50%;border:2px solid rgba(79,211,190,.4)}
.pulse.p1{width:220px;height:220px;left:10px;bottom:-62px;opacity:.55}
.pulse.p2{width:330px;height:330px;left:-46px;bottom:-117px;opacity:.32}
.pulse.p3{width:440px;height:440px;left:-101px;bottom:-172px;opacity:.16}
.stage .device{position:absolute;left:0;bottom:0}
.q{font-family:var(--fh);font-weight:700;font-size:60px;line-height:1.16;letter-spacing:-.02em;margin-top:36px;max-width:900px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:36px}
.foot .fl{max-width:660px}
.foot .cta{font-family:var(--fh);font-weight:700;font-size:26px;color:#fff}
.foot .hint{font-size:15px;color:rgba(255,255,255,.4);margin-top:9px;line-height:1.5;letter-spacing:.01em}
.qrcard{background:#fff;border-radius:22px;padding:20px;flex-shrink:0}
</style></head><body>

<section class="sheet dark">
  {{MARK 40px|#ffffff}}

  <div class="stage">
    <div class="pulse p3"></div>
    <div class="pulse p2"></div>
    <div class="pulse p1"></div>
    <div class="device">{{DEVICE 300px|#ffffff|#4FD3BE}}</div>
  </div>

  <div class="q">Et si ce que vous cherchez<br>se trouvait juste à côté&nbsp;?</div>

  <div class="grow"></div>
  <hr class="rule">
  <div class="u1"></div>
  <div class="foot">
    <div class="fl">
      <div class="cta">→ Lien en bio</div>
      <div class="hint">Ménage · Repassage · Nettoyage — Grasse &amp; alentours</div>
    </div>
    <div class="qrcard">{{QR ig|118px}}</div>
  </div>
</section>

</body></html>
