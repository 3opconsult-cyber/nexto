<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PING — maquette navigable v2</title>
<meta name="theme-color" content="#123644">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#12B39C;--tealD:#0C8F7E;--navy:#123644;--gold:#F2A93B;--orange:#E8743B;--paper:#F3F6F5;--card:#fff;--ink:#123644;--slate:#4E6470;--line:#DCE5E3;--land:#EAF1EC;--water:#BFE3F0;--bg:#EEF3F2;--road:#fff;--park:#CFE6D2;--ok:#1a8f4c;--red:#c0503a}
:root[data-theme=dark]{--paper:#0F232C;--card:#17323D;--ink:#EAF4F2;--slate:#A9BEC6;--line:#2A4753;--land:#1B3540;--water:#1E4B63;--bg:#0A171D;--road:#2E4E5A;--park:#21483F;--navy:#EAF4F2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:50;background:#123644;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top h1{font:700 16px Quicksand,sans-serif;margin-right:auto}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:#cfe3e8;min-height:36px}
.seg button.on{background:#fff;color:#123644}
.tabs{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto}
.tabs button{padding:9px 14px;border-radius:12px 12px 0 0;font-weight:600;color:var(--slate);background:transparent;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink)}
.banner{background:#FFF4DD;color:#8A5A00;text-align:center;font-size:12.5px;padding:6px 10px;font-weight:600}
.wrap{display:flex;gap:22px;padding:18px 14px 40px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.side{width:360px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.side h2{font:700 17px Quicksand,sans-serif;margin-bottom:4px}
.side h3{font:700 13px Quicksand,sans-serif;margin:14px 0 6px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em}
.side p,.side li{font-size:13px;color:var(--slate)}
.side ul{padding-left:18px}
.goto{display:flex;flex-wrap:wrap;gap:6px}
.goto button{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;background:var(--paper);min-height:34px}
.goto button.on{background:var(--navy);color:var(--paper)}
.phonewrap{width:390px;height:844px;flex:0 0 auto}
.phone{width:390px;height:844px;border-radius:44px;background:#000;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);transform-origin:top left}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.status{height:26px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;color:var(--ink)}
.view{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:0 0 84px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
.tabbar{flex:0 0 auto;height:64px;background:var(--card);border-top:1px solid var(--line);display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--slate);min-height:48px}
.tabbar button.on{color:var(--teal)}
.tabbar.pro button.on{color:var(--gold)}
.tabbar svg{width:22px;height:22px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.hd{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:52px}
.hd h2{font:700 18px Quicksand,sans-serif;flex:1}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.pad{padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:15px;padding:0 18px}
.btn.gold{background:var(--gold);color:#3a2600}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;width:auto;font-size:14px}
.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;min-height:40px}
.chip.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#E3F6F2;color:#0C6F61;font-weight:700;font-size:11.5px}
.tag.warn{background:#FFF1D6;color:#8A5A00}.tag.red{background:#FBE5DF;color:#9b3a26}.tag.gray{background:var(--paper);color:var(--slate)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{color:var(--slate);font-size:12.5px}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 16px Quicksand,sans-serif;flex:0 0 auto}
.h1{font:700 22px Quicksand,sans-serif;padding:6px 14px 2px}
.sub{color:var(--slate);padding:0 14px 10px;font-size:13.5px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{font:700 22px Quicksand,sans-serif;display:block}
.kpi small{color:var(--slate);font-size:12px}
/* carte */
.map{position:absolute;inset:0;overflow:hidden;background:var(--land)}
.maplayer{position:absolute;inset:0;transform-origin:50% 40%;transition:transform .25s}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;min-height:44px;justify-content:flex-end}
.pin .p{background:var(--navy);color:var(--paper);font:700 12px Quicksand,sans-serif;padding:4px 9px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 6px rgba(18,54,68,.3);white-space:nowrap}
.pin .a{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(18,54,68,.35);display:flex;align-items:center;justify-content:center;color:#fff;font:700 13px Quicksand,sans-serif;position:relative}
.pin .a.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--teal);animation:echo 2s ease-out infinite}
@keyframes echo{from{transform:scale(.8);opacity:.7}to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin .a.live::after{animation:none}}
.me{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--teal);border:4px solid #fff;box-shadow:0 0 0 7px rgba(18,179,156,.28);transform:translate(-50%,-50%)}
.mapui{position:absolute;left:0;right:0;top:0;padding:6px 0 0;pointer-events:none}
.mapui>*{pointer-events:auto}
.search{margin:0 14px 8px;background:var(--card);border-radius:16px;box-shadow:0 8px 22px rgba(20,50,60,.18);display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;color:var(--slate);font-weight:500;width:calc(100% - 28px)}
.fabs{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;transition:bottom .25s}
.fabs button{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 12px rgba(20,50,60,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -14px 36px rgba(20,50,60,.22);display:flex;flex-direction:column;transition:height .25s;z-index:5}
.sheet .grab{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.sheet .grab i{width:44px;height:5px;border-radius:3px;background:#C5D3D0}
.sheet .in{flex:1;overflow-y:auto;padding:0 14px 14px}
.mbanner{margin:6px 14px;background:var(--navy);color:var(--paper);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;min-height:52px}
.mbanner span{flex:1}
.mbanner button{background:var(--teal);color:#fff;border-radius:999px;padding:0 14px;min-height:36px;font-weight:700;font-size:13px}
/* frise */
.steps{display:flex;flex-direction:column;gap:0;padding:4px 0}
.step{display:flex;gap:12px;align-items:flex-start;min-height:54px}
.step .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;position:relative}
.step:not(:last-child) .d::after{content:"";position:absolute;left:10px;top:26px;width:2px;height:28px;background:var(--line)}
.step.done .d{background:var(--teal);border-color:var(--teal)}
.step.done:not(:last-child) .d::after{background:var(--teal)}
.step.now .d{border-color:var(--teal);box-shadow:0 0 0 5px rgba(18,179,156,.2)}
.step b{font-weight:600}.step small{display:block;color:var(--slate);font-size:12.5px}
.qr{width:200px;height:200px;margin:8px auto;background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;font-size:13px;margin-bottom:5px;color:var(--slate)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);min-height:48px}
.field input:focus,.field textarea:focus,.field select:focus,button:focus-visible{outline:3px solid rgba(18,179,156,.5);outline-offset:2px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.tg{width:50px;height:30px;border-radius:99px;background:#C5D3D0;position:relative;flex:0 0 auto}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--teal)}.tg.on::after{left:23px}
.toast{position:absolute;left:14px;right:14px;bottom:76px;background:var(--navy);color:var(--paper);border-radius:14px;padding:12px 14px;font-weight:600;z-index:30;animation:in .18s}
.cam{margin:8px 14px;height:230px;border-radius:18px;background:#0e1d24;position:relative;display:flex;align-items:center;justify-content:center;color:#cfe3e8;font-weight:600;text-align:center}
.cam .fr{position:absolute;inset:26px 24px;border:3px dashed rgba(255,255,255,.6);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--slate);font-weight:600;background:var(--paper);position:sticky;top:0}
.pane{max-width:1100px;margin:0 auto;padding:18px 14px 50px}
.pane h2{font:700 20px Quicksand,sans-serif;margin:6px 0 10px}
.pane .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
.sev{font-weight:700;font-size:12px;padding:3px 8px;border-radius:99px;display:inline-block}
.sev.p0{background:#FBE5DF;color:#9b3a26}.sev.p1{background:#FFF1D6;color:#8A5A00}.sev.p2{background:#E3F6F2;color:#0C6F61}
.st-present{color:var(--ok);font-weight:700}.st-incomplet{color:#B07400;font-weight:700}.st-absent{color:var(--red);font-weight:700}
.link{color:var(--tealD);font-weight:700;text-decoration:underline;min-height:36px}
[hidden]{display:none!important}
@media (max-width:820px){.phonewrap{width:100%!important;height:auto!important}.phone{width:100%;height:calc(100dvh - 120px);min-height:560px;padding:0;border-radius:0;box-shadow:none;background:none;transform:none!important}.screen{border-radius:0}.status{display:none}.wrap{padding:0 0 30px;gap:12px}.side{margin:0 12px}.top{padding:8px 10px}.seg button{padding:7px 10px}}
</style>
</head>
<body>
<div class="top">
  <h1>PING — maquette navigable v2</h1>
  <div class="seg" id="roles" role="tablist" aria-label="Profil">

  </div>
  <button class="seg" id="theme" style="padding:3px" aria-label="Thème clair ou sombre"><span style="padding:7px 12px;color:#fff;font-weight:600;font-size:13px" id="themeTxt">Thème sombre</span></button>
</div>
<div class="banner">Démo : maquette de travail, données fictives. Aucune donnée n'est enregistrée.</div>

  <button data-tab="mock" class="on">Maquette</button><button data-tab="audit">Audit des manques</button><button data-tab="qc">Contrôle qualité</button>
</div>

<div id="p_mock" class="wrap">
  <div class="phonewrap" id="pw"><div class="phone" id="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>PING</span></div>
    <div class="view" id="view"></div>
    <div class="tabbar" id="tabbar"></div>
  </div></div></div>
  <aside class="side">
    <h2 id="sname">Écran</h2>

    <ul id="srules"></ul>
    <h3>Aller directement à un écran</h3>

  </aside>
</div>

<div id="p_audit" class="pane" hidden></div>
<div id="p_qc" class="pane" hidden></div>

const cur=()=>S.stack[S.stack.length-1];
function setRole(r,screen){S.role=r;S.tab=(TABS[r][0]||[])[0];S.stack=[screen||(r==='public'?'welcome':TABS[r][0][0])];if(r==='pro'&&!screen)S.dbl=true;paint()}
function go(n,p){S.stack.push(n);S.arg=p;paint()}
function back(){if(S.stack.length>1)S.stack.pop();paint()}
function tabTo(t){S.stack=[t];paint()}
function toast(m){S.toast=m;paint();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast='';paint()},2400)}
function render(n){return (SC[n]||SC.notfound)(S.arg)}
function paint(){
 const n=cur();const keep=view.firstElementChild&&view.firstElementChild.dataset.s===n?view.firstElementChild.scrollTop:0;
 view.innerHTML=render(n)+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
 const pg=view.firstElementChild;if(pg){pg.dataset.s=n;pg.scrollTop=keep}
 const T=TABS[S.role];const isPro=S.role==='pro';
 tabbar.className='tabbar'+(isPro?' pro':'');tabbar.style.display=T.length?'flex':'none';
 tabbar.innerHTML=T.map(t=>`<button data-a="tab:${t[0]}" class="${S.stack[0]===t[0]||(t[0]==='missions'&&['mission','qr','invoice','review'].includes(n)&&false)?'on':''}" aria-label="${t[1]}">${ic(t[2])}<span>${t[1]}</span></button>`).join('');
 document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));
 const m=META[n]||META.notfound;$('#sname').textContent=m[0];$('#swhat').textContent=m[1];
 $('#schange').innerHTML=m[2].map(x=>`<li>${x}</li>`).join('')||'<li>Écran déjà conforme.</li>';
 $('#srules').innerHTML=(m[3].length?m[3]:['Aucune règle particulière.']).map(x=>`<li>${x}</li>`).join('');
 $('#goto').innerHTML=GOTO[S.role].map(g=>`<button data-g="${g[0]}" class="${n===g[0]?'on':''}">${g[1]}</button>`).join('');
 const gr=$('#grab');if(gr)bindSheet(gr);
 const sp=$('#swp');if(sp)bindSwipe(sp);
 const ci=view.querySelector('[data-city]');if(ci)ci.oninput=e=>{S.city=e.target.value};
 const si=view.querySelector('[data-siret]');if(si)si.oninput=e=>{S.siret=e.target.value;if(e.target.value.replace(/\s/g,'').length>=14)paint(),view.querySelector('[data-siret]').focus()};
}
const ACT={
 back,sheet(){S.sheet={peek:'half',half:'full',full:'peek'}[S.sheet];paint()},
 signup(p){S.sg=0;S.stack=['signup'];S.arg=p;S.role='public';paint()},
 signupgo(p){if(p==='pro'){S.role='pro';S.dbl=false;S.stack=['pwiz'];S.pwiz=0;S.tab='pmap';paint()}else setRole('client')},

 cat(t,i){S.cat[t][+i][3]=!S.cat[t][+i][3];paint()},price(t,i,d){const c=S.cat[t][+i];c[1]=Math.max(0,c[1]+(+d)*(c[2]==='forfait'?5:1));paint()},
 qual(q){const i=S.quals.indexOf(q);i<0?S.quals.push(q):S.quals.splice(i,1);paint()},
 siretfill(){S.siret='123 456 789 00012';paint()},siretok(){toast('Entreprise enregistrée');S.stack=['pprofile'];paint()},
 wz(){if(S.pwiz<3){S.pwiz++;paint()}else{S.stack=['pprofile'];S.tab='pprofile';paint();toast('Profil publié : vous êtes visible dès la validation de vos pièces')}},
 aflt(f){S.aflt=f;paint()},toast(m){toast(m)}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(b&&b.closest('.screen')){const parts=b.dataset.a.split(':');const k=parts.shift();if(ACT[k]){if(k==='toast')ACT.toast(parts.join(':'));else if(k==='qual'&&parts[0]==='m')ACT.qual(parts.join(':'));else ACT[k](...parts)}return}
 const g=e.target.closest('[data-g]');if(g){const n=g.dataset.g;S.stack=[n];if(['mission','qr','invoice','review','procard','book','reqnew','id','catalog','siret','pwiz','preq','a_fb'].includes(n)&&S.role!=='public'){const root=TABS[S.role][0][0];S.stack=[root,n]}S.arg=null;paint();return}
 const r=e.target.closest('#roles button');if(r){setRole(r.dataset.role)}
});
function bindSheet(gr){let y0=null,h0=0;const sh=$('#sheet');
 gr.addEventListener('pointerdown',e=>{y0=e.clientY;h0=sh.offsetHeight;gr.setPointerCapture(e.pointerId)});
 gr.addEventListener('pointermove',e=>{if(y0==null)return;sh.style.transition='none';sh.style.height=Math.max(100,Math.min(640,h0+(y0-e.clientY)))+'px'});
 gr.addEventListener('pointerup',e=>{if(y0==null)return;const moved=Math.abs(y0-e.clientY);const h=sh.offsetHeight;y0=null;sh.style.transition='';if(moved<6)return;const k=Object.keys(SH).reduce((a,b)=>Math.abs(SH[b]-h)<Math.abs(SH[a]-h)?b:a);S.sheet=k;paint()});
 gr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ACT.sheet()}})}
function bindSwipe(el){let x0=null;el.addEventListener('pointerdown',e=>{x0=e.clientX});el.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>60){dx<0?ACT.next():ACT.prev()}})}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));['mock','audit','qc'].forEach(t=>$('#p_'+t).hidden=t!==b.dataset.tab);if(b.dataset.tab==='audit')auditPane();if(b.dataset.tab==='qc')qcPane()});
function jump(role,screen){setRole(role,null);if(screen){const root=S.stack[0];S.stack=screen===root?[root]:[root,screen];S.arg=null}paint();document.querySelector('#tabs button[data-tab=mock]').click();window.scrollTo(0,0)}
window.jump=jump;

function auditPane(){$('#p_audit').innerHTML=`<h2>Audit des manques</h2><p style="color:var(--slate);margin-bottom:10px">Chaque écran de l'app actuelle, son statut, et son écran dans la maquette (cliquez « Voir »). Sources : les 5 audits du 07/11 et les remarques de Romain.</p><div class="tablewrap"><table class="t"><tr><th>Écran</th><th>App en ligne</th><th>Priorité</th><th>Critique et correction</th><th>Maquette</th></tr>${AUDIT.map(a=>`<tr><td><b>${a[0]}</b></td><td class="st-${a[3]}">${{present:'Présent',incomplet:'Incomplet',absent:'Absent'}[a[3]]}</td><td><span class="sev ${a[4].toLowerCase()}">${a[4]}</span></td><td>${a[5]}</td><td><button class="link" onclick="jump('${a[1]}','${a[2]}')">Couvert · Voir</button></td></tr>`).join('')}</table></div>`}
function qcPane(){
 const re={certifié:/certifi/i,garanti:/garanti/i,marques:/airbnb|uber|booking|wecasa|taskrabbit|leboncoin|nextdoor/i,bientôt:/bientôt/i,emoji:/[\u{1F300}-\u{1FAFF}\u{2700}-\u{27BF}]/u};
 const roles=Object.keys(GOTO);const hits={};Object.keys(re).forEach(k=>hits[k]=0);let n=0;
 const keep=[S.role,S.stack,S.arg];const box=document.createElement('div');
 roles.forEach(r=>GOTO[r].forEach(g=>{S.role=r;S.stack=[g[0]];n++;try{box.innerHTML=render(g[0]);const t=box.textContent+(META[g[0]]||[]).flat(2).join(' ');Object.keys(re).forEach(k=>{if(re[k].test(t))hits[k]++})}catch(e){}}));
 [S.role,S.stack,S.arg]=keep;
 $('#p_qc').innerHTML=`<h2>Contrôle qualité</h2>
 <div class="card"><b>Mots interdits : recherche automatique sur les ${n} écrans de cette maquette</b>
 ${Object.keys(re).map(k=>`<div class="row"><span class="grow">« ${k==='emoji'?'emoji colorés':k==='marques'?'noms de marques tierces':k} »</span><span class="tag ${hits[k]?'red':''}">${hits[k]} occurrence${hits[k]>1?'s':''}</span></div>`).join('')}</div>
 <h2>Incohérences trouvées et correction dans la maquette</h2><div class="tablewrap"><table class="t"><tr><th>Incohérence (audit)</th><th>Correction</th></tr>
 <tr><td>« Adresse visible » dite de trois façons</td><td>Une phrase unique : « confirmée et payée »</td></tr>
 <tr><td>Séquestre « Bientôt » sur l'écran des paiements</td><td>Aucune mention « bientôt » : paiement = virement sur facture</td></tr>
 <tr><td>« Commission retenue » alors que tout passe par virement</td><td>« Frais de service », document séparé</td></tr>
 <tr><td>Logo PING sur la facture de la prestation</td><td>En-tête du prestataire seulement</td></tr>
 <tr><td>Deux libellés pour la même action (« Terminer », « Passer et terminer »)</td><td>Un seul bouton par étape</td></tr>
 <tr><td>Total « sur 5 » puis « sur 6 » en cours d'inscription</td><td>Barre fixe 4 étapes</td></tr></table></div>
 <h2>Suggestions non réalisées, par impact</h2><div class="tablewrap"><table class="t"><tr><th>Suggestion</th><th>Impact</th></tr>
 <tr><td>Connexion par lien magique (sans mot de passe)</td><td>Fort : moins d'abandon à l'inscription</td></tr>
 <tr><td>Carte vectorielle libre aux couleurs PING (MapLibre + tuiles gratuites)</td><td>Fort : look et robustesse, fin de la dépendance aux tuiles publiques</td></tr>
 <tr><td>Notifications de nouvelle demande près de soi</td><td>Fort : réactivité des prestataires</td></tr>
 <tr><td>Catalogue de services en base (nouveaux services sans code)</td><td>Fort : extension de l'offre</td></tr>
 <tr><td>Favoris et « refaire avec le même prestataire »</td><td>Moyen</td></tr></table></div>
 <h2>Décisions à valider</h2><div class="card"><p>1. Barre du bas à 3 entrées (Carte, Missions, Profil).<br>2. Inscription en un écran et profil progressif.<br>3. Carte vectorielle gratuite (conditions à vérifier avant branchement).<br>4. Catalogue de prix par modèles.<br>5. Ordre de mise en production, paquet par paquet.</p></div>
 <p style="color:var(--slate);margin-top:10px">Non vérifié : rendu sur vrai iPhone et en application installée ; conditions d'usage de la carte gratuite ; veille concurrentielle chiffrée.</p>`}
