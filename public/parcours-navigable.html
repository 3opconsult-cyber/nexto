<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PING — Parcours navigable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Parcours navigable : captures RÉELLES de l'application (prod, comptes de test, missions « Exemple — … »).
  Les images et le manifeste sont dans le bucket Supabase public `parcours`, générés par
  scripts/parcours/capture.mjs : relancer ce script met la page à jour sans déploiement.
  L'ancienne maquette dessinée à la main est conservée dans /parcours-navigable-ancien.html.
-->
<style>
  :root{ --navy:#123644; --teal:#12B39C; --teal-d:#0C8F7E; --paper:#F3F6F5; --line:#E7EDEB; --text2:#4E6470; --bg:#DCE5E3; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .qs{font-family:'Quicksand',sans-serif;font-weight:700}
  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px 0}
  .hin{max-width:1100px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .brand h1{margin:0;font-size:18px}
  .brand small{color:rgba(255,255,255,.75);font-size:12px}
  .sides{display:flex;gap:6px;margin:12px 0 0}
  .side{flex:1;max-width:200px;border:none;border-radius:12px 12px 0 0;padding:10px 12px;font:700 13.5px 'Quicksand',sans-serif;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
  .side[aria-pressed=true]{background:var(--paper);color:var(--navy)}
  main{max-width:1100px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:280px 1fr;gap:24px}
  nav.toc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;align-self:start;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
  .chap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:12px 6px 4px}
  .chap:first-child{margin-top:2px}
  .item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:8px;border-radius:10px;cursor:pointer;font:600 13px 'Inter',sans-serif;color:var(--navy)}
  .item .n{width:22px;height:22px;border-radius:999px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2);flex-shrink:0}
  .item[aria-current=true]{background:rgba(18,179,156,.1);color:var(--teal-d)}
  .item[aria-current=true] .n{background:var(--teal);color:#fff}
  .stage{display:flex;gap:28px;align-items:flex-start;justify-content:center}
  .phone{width:360px;flex-shrink:0;background:#0f2a35;border-radius:38px;padding:12px;box-shadow:0 18px 40px rgba(18,54,68,.25)}
  .screen{height:740px;border-radius:28px;overflow-y:auto;background:var(--paper);scrollbar-width:thin}
  .screen img{display:block;width:100%;height:auto}
  .info{max-width:380px;padding-top:20px}
  .crumb{font-size:12px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:.04em}
  .info h2{font-size:24px;margin:6px 0 10px}
  .info p{font-size:15px;line-height:1.6;color:var(--text2);margin:0 0 18px}
  .scrollhint{font-size:12.5px;color:var(--text2);display:flex;gap:6px;align-items:center;margin-bottom:18px}
  .navbtns{display:flex;gap:8px;align-items:center}
  .btn{border:none;border-radius:999px;padding:12px 18px;font:700 14px 'Quicksand',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.prim{background:var(--teal);color:#fff}
  .btn.sec{background:#fff;color:var(--navy);border:1.5px solid #DCE5E3}
  .btn:disabled{opacity:.4;cursor:default}
  .count{font-size:13px;color:var(--text2);font-weight:600;margin-left:6px}
  .open{display:inline-block;margin-top:18px;font-size:13px;font-weight:700;color:var(--teal-d)}
  .stamp{margin-top:22px;font-size:12px;color:var(--text2)}
  .empty{background:#fff;border-radius:16px;padding:28px;text-align:center;color:var(--text2);grid-column:1/-1}
  @media (max-width: 860px){
    main{grid-template-columns:1fr;padding:12px 16px 30px}
    nav.toc{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px;white-space:nowrap}
    .chap{display:none}
    .item{width:auto;flex-shrink:0;background:var(--paper)}
    .stage{flex-direction:column;align-items:center;gap:14px}
    .phone{width:100%;max-width:360px}
    .screen{height:68vh}
    .info{padding-top:0;max-width:360px}
    .info h2{font-size:20px}
  }
</style>
</head>
<body>
<header>
  <div class="hin">
    <div class="brand">
      <div><h1 class="qs">PING — Parcours navigable</h1><small>Captures réelles de l'application, données de démonstration</small></div>
    </div>
    <div class="sides" role="tablist">
      <button class="side" data-side="particulier" aria-pressed="true">Particulier</button>
      <button class="side" data-side="prestataire" aria-pressed="false">Prestataire</button>
    </div>
  </div>
</header>
<main id="main">
  <div class="empty">Chargement des écrans…</div>
</main>
<script>
(function () {
  var BASE = 'https://wmiawwaxwlvascyflpba.supabase.co/storage/v1/object/public/parcours/';
  var all = [], side = 'particulier', idx = 0, stamp = '';
  var main = document.getElementById('main');

  function list() { return all.filter(function (s) { return s.side === side }) }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

  function render() {
    var L = list();
    if (!L.length) { main.innerHTML = '<div class="empty">Aucun écran pour l’instant.</div>'; return }
    if (idx >= L.length) idx = L.length - 1;
    var s = L[idx], toc = '', chap = '';
    L.forEach(function (x, i) {
      if (x.chapter !== chap) { chap = x.chapter; toc += '<div class="chap">' + esc(chap) + '</div>' }
      toc += '<button class="item" data-i="' + i + '" aria-current="' + (i === idx) + '"><span class="n">' + (i + 1) + '</span>' + esc(x.title) + '</button>';
    });
    main.innerHTML =
      '<nav class="toc" aria-label="Écrans">' + toc + '</nav>' +
      '<section class="stage" id="' + esc(s.id) + '">' +
        '<div class="phone"><div class="screen" id="scr"><img alt="' + esc(s.title) + '" src="' + BASE + s.img + '?v=' + encodeURIComponent(stamp) + '"></div></div>' +
        '<div class="info">' +
          '<div class="crumb">' + (side === 'particulier' ? 'Particulier' : 'Prestataire') + ' · ' + esc(s.chapter) + '</div>' +
          '<h2 class="qs">' + esc(s.title) + '</h2>' +
          '<p>' + esc(s.caption) + '</p>' +
          (s.full ? '<div class="scrollhint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Faites défiler l’écran du téléphone pour voir toute la page.</div>' : '') +
          '<div class="navbtns">' +
            '<button class="btn sec" id="prev"' + (idx === 0 ? ' disabled' : '') + '><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>Précédent</button>' +
            '<button class="btn prim" id="next"' + (idx === L.length - 1 ? ' disabled' : '') + '>Suivant<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg></button>' +
            '<span class="count">' + (idx + 1) + ' / ' + L.length + '</span>' +
          '</div>' +
          '<a class="open" href="https://nexto-eta.vercel.app/" target="_blank" rel="noopener">Ouvrir l’application</a>' +
          (stamp ? '<div class="stamp">Captures du ' + new Date(stamp).toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short' }) + '</div>' : '') +
        '</div>' +
      '</section>';
    main.querySelectorAll('.item').forEach(function (b) { b.onclick = function () { go(+b.dataset.i) } });
    document.getElementById('prev').onclick = function () { go(idx - 1) };
    document.getElementById('next').onclick = function () { go(idx + 1) };
    var cur = main.querySelector('.item[aria-current=true]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
    // Précharge l'écran suivant.
    if (L[idx + 1]) { var im = new Image(); im.src = BASE + L[idx + 1].img + '?v=' + encodeURIComponent(stamp) }
    try { history.replaceState(null, '', '#' + s.id) } catch (e) { }
    document.querySelectorAll('.side').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.side === side)) });
  }
  function go(i) { var L = list(); if (i < 0 || i >= L.length) return; idx = i; render(); var sc = document.getElementById('scr'); if (sc) sc.scrollTop = 0 }
  function fromHash() {
    var h = (location.hash || '').slice(1); if (!h) return;
    var s = all.find(function (x) { return x.id === h }); if (!s) return;
    side = s.side; idx = list().indexOf(s);
  }

  document.querySelectorAll('.side').forEach(function (b) { b.onclick = function () { side = b.dataset.side; idx = 0; render() } });
  window.addEventListener('hashchange', function () { var cur = list()[idx]; if (cur && location.hash === '#' + cur.id) return; fromHash(); render() });
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1) });
  var x0 = null;
  document.addEventListener('touchstart', function (e) { if (e.target.closest && e.target.closest('.phone')) x0 = e.touches[0].clientX }, { passive: true });
  document.addEventListener('touchend', function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) go(idx + (dx < 0 ? 1 : -1)) }, { passive: true });

  fetch(BASE + 'manifest.json?t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json() }).then(function (m) {
    all = m.screens || []; stamp = m.generated_at || ''; fromHash(); render();
  }).catch(function () {
    main.innerHTML = '<div class="empty">Les captures ne sont pas encore disponibles. <a href="/parcours-navigable-ancien.html">Voir l’ancienne maquette</a>.</div>';
  });
})();
</script>
</body>
</html>
