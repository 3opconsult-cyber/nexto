<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bienvenue sur PING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Une plaquette par cible, même gabarit : une idée par écran, gros pictogramme, contact direct au dernier écran. */
  :root{
    --teal:#12B39C; --tealD:#0C8F7E; --navy:#123644; --green:#2FD06E; --gold:#F2A93B;
    --ground:#EDF1F0; --ink:#123644; --slate:#4E6470;
    --display:'Quicksand','Trebuchet MS',sans-serif; --body:'Inter',system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--ground); color:var(--ink);}
  body{margin:0; font-family:var(--body); padding-block:28px 48px;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
  header{max-width:540px; margin:0 auto 18px; text-align:center;}
  header .eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tealD);}
  header h1{font-family:var(--display); font-weight:700; font-size:24px; margin:6px 0 14px; text-wrap:balance;}
  .chips{display:flex; flex-wrap:wrap; justify-content:center; gap:7px;}
  .chips a{font-size:12.5px; font-weight:600; color:var(--tealD); background:rgba(18,179,156,.1); padding:7px 13px; border-radius:999px; text-decoration:none;}
  .chips a.on{background:var(--navy); color:#fff;}
  .chips a:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .deck{max-width:540px; margin:0 auto; background:var(--navy); border-radius:24px; color:#fff; overflow:hidden; box-shadow:0 18px 50px rgba(18,54,68,.25);}
  .deck-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 24px 0;}
  .deck-head .kicker{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--gold);}
  .deck-head .count{white-space:nowrap; font-size:12px; font-weight:600; color:rgba(255,255,255,.5); font-variant-numeric:tabular-nums;}
  .deck-track{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .deck-track::-webkit-scrollbar{display:none;}
  .slide{flex:0 0 100%; scroll-snap-align:center; min-height:390px; padding:26px 28px 18px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px;}
  .picto{width:116px; height:116px; border-radius:34px; background:rgba(18,179,156,.16); display:flex; align-items:center; justify-content:center; color:var(--teal); flex-shrink:0;}
  .picto svg{width:62px; height:62px;}
  .picto svg.device{width:46px; height:74px;}
  .slide h2{font-family:var(--display); font-weight:700; font-size:27px; line-height:1.18; margin:0; color:#fff; text-wrap:balance; max-width:16ch;}
  .slide p{font-size:15px; color:rgba(255,255,255,.72); margin:0; max-width:30ch; line-height:1.5;}
  .deck-nav{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 24px;}
  .deck-nav .arrow{width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .deck-nav .arrow:disabled{opacity:.28; cursor:default;}
  .dots{display:flex; gap:7px;}
  .dots button{width:8px; height:8px; padding:0; border:none; border-radius:4px; background:rgba(255,255,255,.28); cursor:pointer; transition:width .2s, background .2s;}
  .dots button.on{width:22px; background:var(--teal);}
  .deck button:focus-visible, .deck a:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .trio h2{max-width:none; font-size:26px; line-height:1.35;}
  .trio h2 em{font-style:normal; color:var(--teal);}
  .trio .rule{width:44px; height:3px; border-radius:2px; background:var(--gold);}
  .trust{gap:14px;}
  .trust h2{font-size:24px;}
  .tlist{display:flex; flex-direction:column; gap:9px; width:100%; max-width:340px; text-align:left;}
  .tlist div{display:flex; align-items:center; gap:11px; background:rgba(255,255,255,.07); border-radius:12px; padding:9px 12px;}
  .tlist svg{width:22px; height:22px; flex-shrink:0; color:var(--teal);}
  .tlist b{font-family:var(--display); font-size:14.5px; color:#fff; flex:1; min-width:0;}
  .tlist i{font-style:normal; font-size:11px; font-weight:700; color:#3a2a06; background:var(--gold); border-radius:999px; padding:3px 8px;}
  .join h2{font-size:25px;}
  .join-row{display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; text-align:left;}
  .join-qr{width:136px; height:136px; background:#fff; border-radius:18px; padding:8px; flex-shrink:0;}
  .join-qr svg{display:block; width:100%; height:100%;}
  .join-acts{display:flex; flex-direction:column; gap:10px; min-width:0;}
  .join-acts .go{display:inline-flex; justify-content:center; background:var(--teal); color:#fff; text-decoration:none; font-family:var(--display); font-weight:700; font-size:14.5px; padding:12px 22px; border-radius:999px;}
  .join-acts .lbl{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.5);}
  .mail{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.09); border-radius:999px; padding:5px 5px 5px 16px;}
  .mail span{font-size:14px; font-weight:600; user-select:all; overflow-wrap:anywhere;}
  .mail button{flex-shrink:0; border:none; background:#fff; color:var(--navy); font-family:var(--display); font-weight:700; font-size:12px; padding:8px 13px; border-radius:999px; cursor:pointer;}
  .join small{font-size:12px; color:rgba(255,255,255,.55);}
  .anim-btn{display:inline-flex; align-items:center; gap:6px; flex-shrink:0; background:rgba(255,255,255,.12); color:#fff; text-decoration:none; font-family:var(--display); font-weight:700; font-size:12.5px; padding:7px 13px 7px 11px; border-radius:999px;}
  .anim-btn svg{width:14px; height:14px;}
  .anim-btn.big{font-size:14px; padding:10px 18px 10px 15px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35); background:transparent;}
  .join-acts .go.alt{background:transparent; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4); font-size:13px; padding:9px 18px;}
  .join-acts .go.signup{font-size:16px; padding:14px 26px;}
  .beta{margin:0; max-width:34ch; font-size:12.5px; line-height:1.5; color:var(--gold); border:1.5px dashed rgba(242,169,59,.6); border-radius:12px; padding:9px 12px;}

  @media (prefers-reduced-motion: reduce){ .deck-track{scroll-behavior:auto;} }

  /* --- Plaquette unique (généré par brand/plaquettes/build_bienvenue.py) --- */
  body{padding-block:16px;}
  .deck{display:flex; flex-direction:column; min-height:calc(100vh - 32px); min-height:calc(100svh - 32px);}
  .deck-track{flex:1;}
  .slide{min-height:0; justify-content:center;}
  .deck[data-stage="cover"] .back, .deck:not([data-stage="slides"]) .count{visibility:hidden;}
  .deck:not([data-stage="slides"]) .deck-nav{display:none;}
  .back svg{width:14px; height:14px; margin-right:6px;}
  .choice .who{font-family:var(--display); font-size:30px; line-height:1.15; margin:0; color:#fff; max-width:14ch; text-wrap:balance;}
  .cta.a, .cta.b{text-decoration:none;}
  .anim-btn{border:none; cursor:pointer;}
  .cover{gap:14px;}
  .radar{position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .radar i{position:absolute; inset:0; border-radius:50%; border:2px solid var(--teal); opacity:0; animation:echo 3.2s ease-out infinite;}
  .radar i:nth-child(2){animation-delay:1.06s;} .radar i:nth-child(3){animation-delay:2.12s;}
  .radar svg.device{position:relative; width:64px; height:102px;}
  @keyframes echo{0%{transform:scale(.4); opacity:.7;} 100%{transform:scale(1); opacity:0;}}
  .cover .word{font-family:var(--display); font-weight:700; font-size:54px; letter-spacing:.06em; line-height:1; margin:0; color:#fff;}
  .cover .ask{font-size:17px; line-height:1.45; color:rgba(255,255,255,.82); max-width:26ch; text-wrap:balance; margin:0;}
  .cover .rule{width:44px; height:3px; border-radius:2px; background:var(--gold);}
  .choices{display:flex; flex-direction:column; gap:11px; width:100%; max-width:340px; margin-top:6px;}
  .cta{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:12px 20px; border-radius:18px; border:none; cursor:pointer; text-align:left; font-family:var(--display); font-weight:700; font-size:18px; width:100%;}
  .cta svg{width:20px; height:20px; flex-shrink:0;}
  .cta.a{background:var(--teal); color:#fff;}
  .cta.b{background:#fff; color:var(--navy);}
  .deck .cta:focus-visible{outline:3px solid var(--gold); outline-offset:3px;}
  .betaw h2{font-size:25px; max-width:20ch;}
  .betaw p{max-width:34ch; font-size:15px; line-height:1.55; color:rgba(255,255,255,.85);}
  .betaw .cta{max-width:340px; justify-content:center; margin-top:4px;}
  .join .mail{max-width:100%;}
  .join-acts .go{text-align:center;}
  .ov{position:fixed; inset:0; z-index:50; background:rgba(8,22,29,.88); display:flex; align-items:center; justify-content:center; padding:56px 16px 16px;}
  .ov[hidden]{display:none;}
  .ov iframe{border:0; border-radius:20px; background:#000; aspect-ratio:9/16; height:min(calc(100vh - 80px), calc((100vw - 32px) * 16 / 9)); height:min(calc(100svh - 80px), calc((100vw - 32px) * 16 / 9)); max-width:100%;}
  .ov .x{position:absolute; top:max(10px, env(safe-area-inset-top,0px)); right:14px; display:flex; align-items:center; gap:8px; border:none; background:#fff; color:var(--navy); font-family:var(--display); font-weight:700; font-size:14px; padding:9px 15px 9px 13px; border-radius:999px; cursor:pointer;}
  .ov .x svg{width:16px; height:16px;}
  .ov .x:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ .radar i{animation:none; opacity:.25; transform:scale(.8);} .radar i:nth-child(n+2){display:none;} }
</style>
</head>
<body>
<main>
<section class="deck" data-stage="cover" aria-label="Plaquette PING">
  <div class="deck-head"><span class="kicker">Avant-première</span><button type="button" class="anim-btn back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Retour</button><span class="count"></span></div>
  <div class="deck-track" id="track"></div>
  <div class="deck-nav">
    <button type="button" class="arrow prev" aria-label="Écran précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots"></div>
    <button type="button" class="arrow next" aria-label="Écran suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</section>
</main>

<template id="t-cover">
    <div class="slide cover">
      <div class="radar" aria-hidden="true"><i></i><i></i><i></i><svg class="device" viewBox="10 0 100 160" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 56 C24 26, 46 12, 68 18 C92 25, 100 50, 82 68 C70 80, 64 86, 64 98" stroke="#fff" stroke-width="14"/><circle cx="64" cy="134" r="22" stroke="#12B39C" stroke-width="3" opacity=".7"/><circle cx="64" cy="134" r="8" fill="#2FD06E"/></svg></div>
      <h1 class="word">PING</h1>
      <p class="ask">Et si ce que vous cherchez se trouvait juste à côté ?</p>
      <div class="rule"></div>
      <div class="choices">
        <button type="button" class="cta a" data-role="particulier"><span>Je cherche un prestataire</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button type="button" class="cta b" data-role="pro"><span>Je suis prestataire</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
</template>
<template id="t-choice">
    <div class="slide cover choice">
      <h2 class="who"></h2>
      <p class="ask">Comment voulez-vous découvrir PING ?</p>
      <div class="choices">
        <button type="button" class="cta a" data-act="follow"><span>Suivre le parcours</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button type="button" class="cta b" data-act="anim"><span>Voir l'animation</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      </div>
    </div>
</template>
<template id="t-beta">
    <div class="slide betaw">
      <h2>Bienvenue sur PING — version bêta</h2>
      <p>Vous pouvez parcourir, vous inscrire : tout fonctionne, à l'exception des paiements et de la transaction réelle entre prestataires et clients. Nous vous sollicitons pour un test : votre avis sur l'ergonomie, les options qui vous manquent, vos observations et commentaires. Vous pouvez les laisser dans la petite bulle verte, sur la droite. Merci encore pour votre participation.</p>
      <a class="cta a" id="betago" href="/l/ins"><span>Continuer vers l'inscription</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    </div>
</template>
<template id="t-particulier">
    <div class="slide">
      <div class="picto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M10.5 13.5s-2.5-2.2-2.5-4a2.5 2.5 0 0 1 5 0c0 1.8-2.5 4-2.5 4z"/></svg></div>
      <h2>Fini les annuaires et les petites annonces.</h2>
      <p>Une seule carte, les prestataires autour de vous.</p>
    </div>
    <div class="slide trio">
      <h2><em>Simple</em>.<br><em>Rapide</em>.<br>Juste à côté.</h2>
      <div class="rule"></div>
      <p>Réserver, ou proposer ses services, devient un jeu d'enfant. Le prix est affiché avant.</p>
    </div>
    <div class="slide">
      <div class="picto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20.5c0-3.6 3.1-6 7-6s7 2.4 7 6"/><path d="M16.5 3.5l.8 1.6 1.7.2-1.3 1.2.3 1.7-1.5-.8-1.5.8.3-1.7-1.3-1.2 1.7-.2z"/></svg></div>
      <h2>Vous savez qui vient.</h2>
      <p>Profil, avis et tarifs visibles avant de réserver.</p>
    </div>
    <div class="slide trust">
      <h2>En toute confiance.</h2>
      <div class="tlist">
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M7 14.5c.6-1.4 1.8-2 3-2s2.4.6 3 2"/><circle cx="10" cy="9.2" r="1.8"/><path d="M15 10h3M15 13h2"/></svg><b>Pièce d'identité fournie</b></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3.5v5c0 4.6-3.4 8.2-8 9.5-4.6-1.3-8-4.9-8-9.5v-5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><b>Assurance renseignée</b></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8.5l4 4v15H6z"/><path d="M14.5 2.5v4h4"/><path d="M9 12h6.5M9 15.5h4.5"/></svg><b>Facture automatique</b></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6z"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/><path d="M12 15v2.5"/></svg><b>Prix validé avant la mission</b></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/><circle cx="7.5" cy="7.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/></svg><b>Règlement par virement, sur facture</b></div>
      </div>
    </div>
    <div class="slide">
      <div class="picto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4"/><rect x="7.5" y="7.5" width="3.5" height="3.5"/><rect x="13" y="7.5" width="3.5" height="3.5"/><rect x="7.5" y="13" width="3.5" height="3.5"/><path d="M13 13h3.5v3.5"/></svg></div>
      <h2>Arrivée et départ horodatés.</h2>
      <p>Un scan en arrivant, un scan en partant.</p>
    </div>
    <div class="slide join">
      <h2>Trouvez votre prestataire.</h2>
      <div class="join-row">
        <div class="join-qr" aria-label="QR code vers PING"><svg viewBox="0 0 33 33" class="segno"><path fill="#fff" d="M0 0h33v33h-33z"/><path class="qrline" stroke="#123644" d="M2 2.5h7m2 0h1m2 0h1m2 0h4m3 0h7m-29 1h1m5 0h1m1 0h1m1 0h2m1 0h2m1 0h1m3 0h1m1 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h2m1 0h3m1 0h1m3 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h4m4 0h2m2 0h1m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m4 0h2m2 0h6m1 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m3 0h1m4 0h1m6 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-21 1h2m2 0h1m1 0h3m1 0h2m-20 1h1m5 0h1m1 0h1m1 0h1m6 0h2m1 0h3m2 0h3m-28 1h2m6 0h1m2 0h1m1 0h1m2 0h4m3 0h2m1 0h2m-27 1h4m1 0h2m1 0h7m1 0h1m2 0h1m1 0h1m1 0h1m-24 1h1m2 0h1m2 0h7m4 0h1m1 0h6m-25 1h1m1 0h1m1 0h2m1 0h1m3 0h2m1 0h2m2 0h4m5 0h1m-26 1h3m2 0h1m9 0h3m1 0h3m2 0h2m-29 1h2m3 0h2m1 0h1m1 0h2m3 0h2m1 0h1m3 0h1m1 0h3m-24 1h1m1 0h1m5 0h2m3 0h1m2 0h1m1 0h2m3 0h1m1 0h1m-26 1h1m2 0h1m2 0h2m4 0h3m2 0h1m2 0h1m1 0h2m-27 1h1m1 0h4m4 0h1m2 0h4m2 0h2m1 0h3m1 0h3m-29 1h2m3 0h3m1 0h1m5 0h6m1 0h1m1 0h2m2 0h1m-29 1h1m2 0h1m4 0h6m4 0h4m1 0h2m-25 1h1m1 0h1m3 0h2m2 0h1m3 0h4m1 0h6m1 0h3m-21 1h1m1 0h1m3 0h2m4 0h1m3 0h2m-26 1h7m8 0h2m1 0h3m1 0h1m1 0h3m-27 1h1m5 0h1m3 0h3m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1m-28 1h1m1 0h3m1 0h1m3 0h5m1 0h1m1 0h8m1 0h2m-29 1h1m1 0h3m1 0h1m3 0h1m3 0h2m1 0h3m1 0h1m3 0h2m1 0h1m-29 1h1m1 0h3m1 0h1m3 0h1m1 0h4m1 0h1m4 0h6m-28 1h1m5 0h1m4 0h2m1 0h1m6 0h2m2 0h2m1 0h1m-29 1h7m1 0h1m1 0h3m4 0h1m1 0h1m1 0h1m1 0h1m2 0h1"/></svg></div>
        <div class="join-acts">
          <a class="go signup" href="/l/ins">Je m'inscris</a>
          <a class="go alt" href="/map">Découvrir l'application</a>
          <span class="lbl">ou scannez le code</span>
        </div>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="Animation PING">
  <button type="button" class="x" id="ovx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Fermer</button>
  <iframe id="ovf" title="Animation PING" allow="autoplay" src="about:blank"></iframe>
</div>

<script>
(function(){
  var deck = document.querySelector('.deck'), track = document.getElementById('track');
  var dots = deck.querySelector('.dots'), prev = deck.querySelector('.prev'), next = deck.querySelector('.next'), count = deck.querySelector('.count');
  var kicker = deck.querySelector('.kicker');
  var KICK = { particulier: 'Particuliers', pro: 'Prestataires' };
  var WHO = { particulier: 'Je cherche un prestataire', pro: 'Je suis prestataire' };
  var SIGNUP = { particulier: '/l/ins', pro: '/l/insp' };
  var ANIM = { particulier: 'client', pro: 'pro' };
  var role = null, stage = 'cover', betaFrom = 'choice';
  var ov = document.getElementById('ov'), ovf = document.getElementById('ovf'), lastFocus = null;
  function n(){ return track.children.length; }
  function cur(){ return track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0; }
  function go(i, instant){ track.scrollTo({ left: i * track.clientWidth, behavior: instant ? 'auto' : 'smooth' }); }
  function tpl(id){ return document.getElementById(id).content.cloneNode(true); }
  function norm(r){ return r === 'client' ? 'particulier' : ((r === 'particulier' || r === 'pro') ? r : null); }
  function update(){
    if (stage !== 'slides'){ kicker.textContent = (stage !== 'cover' && role) ? KICK[role] : 'Avant-première'; return; }
    var k = cur(), t = n();
    Array.prototype.forEach.call(dots.children, function(d, i){ d.classList.toggle('on', i === k); });
    prev.disabled = k === 0; next.disabled = k >= t - 1; count.textContent = (k + 1) + ' / ' + t;
  }
  function show(st){
    if (!role && st !== 'cover') st = 'cover';
    stage = st; deck.setAttribute('data-stage', st);
    track.innerHTML = ''; dots.innerHTML = '';
    track.appendChild(tpl(st === 'cover' ? 't-cover' : st === 'choice' ? 't-choice' : st === 'beta' ? 't-beta' : 't-' + role));
    if (st === 'choice') track.querySelector('.who').textContent = WHO[role];
    if (st === 'beta') document.getElementById('betago').href = SIGNUP[role];
    if (st === 'slides') for (var i = 0; i < n(); i++) (function(i){
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Écran ' + (i + 1));
      b.addEventListener('click', function(){ go(i); }); dots.appendChild(b);
    })(i);
    track.scrollLeft = 0;
    bindMail(); update();
    window.scrollTo(0, 0);
  }
  function setRole(r){
    role = norm(r);
    try { history.replaceState(null, '', location.pathname + (role ? '#' + role : '')); } catch (x) {}
  }
  function bindMail(){
    track.querySelectorAll('.mail button').forEach(function(b){
      if (b.dataset.b) return; b.dataset.b = 1;
      b.addEventListener('click', function(){
        var s = b.parentNode.querySelector('span');
        function select(){ var r = document.createRange(); r.selectNodeContents(s); var w = getSelection(); w.removeAllRanges(); w.addRange(r); }
        function done(){ b.textContent = 'Copié'; setTimeout(function(){ b.textContent = 'Copier'; }, 1600); }
        if (navigator.clipboard) navigator.clipboard.writeText(s.textContent).then(done, select); else select();
      });
    });
  }
  function openAnim(){ lastFocus = document.activeElement; ovf.src = '/animation-ping?role=' + ANIM[role]; ov.hidden = false; document.body.style.overflow = 'hidden'; document.getElementById('ovx').focus(); }
  function closeAnim(){ ov.hidden = true; ovf.src = 'about:blank'; document.body.style.overflow = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function back(){
    if (stage === 'beta') show(betaFrom);
    else if (stage === 'slides') show('choice');
    else if (stage === 'choice'){ setRole(null); show('cover'); }
  }
  var tick = false;
  track.addEventListener('scroll', function(){ if (tick) return; tick = true; requestAnimationFrame(function(){ update(); tick = false; }); });
  prev.addEventListener('click', function(){ go(Math.max(0, cur() - 1)); });
  next.addEventListener('click', function(){ go(Math.min(n() - 1, cur() + 1)); });
  document.addEventListener('keydown', function(e){
    if (!ov.hidden){ if (e.key === 'Escape') closeAnim(); return; }
    if (stage !== 'slides') return;
    if (e.key === 'ArrowRight') go(Math.min(n() - 1, cur() + 1)); else if (e.key === 'ArrowLeft') go(Math.max(0, cur() - 1));
  });
  deck.addEventListener('click', function(e){
    var r = e.target.closest('[data-role]');
    if (r){ setRole(r.getAttribute('data-role')); show('choice'); return; }
    var a = e.target.closest('[data-act]');
    if (a){ if (a.getAttribute('data-act') === 'anim') openAnim(); else show('slides'); return; }
    if (e.target.closest('[data-back]')){ back(); return; }
    var su = e.target.closest('a.signup');
    if (su){ e.preventDefault(); betaFrom = 'slides'; show('beta'); }
  });
  document.getElementById('ovx').addEventListener('click', closeAnim);
  ov.addEventListener('click', function(e){ if (e.target === ov) closeAnim(); });
  window.addEventListener('hashchange', function(){
    var k = norm((location.hash || '').slice(1));
    if (k !== role){ role = k; show(k ? 'choice' : 'cover'); }
  });
  // entrée : #particulier / #pro ; ?role=client|pro (&go=inscription -> écran bêta directement)
  var q = location.search.match(/[?&]role=([a-z]+)/), g = /[?&]go=inscription\b/.test(location.search);
  if (q && norm(q[1])){
    setRole(q[1]);
    if (g){ betaFrom = 'choice'; show('beta'); } else show('choice');
  } else {
    role = norm((location.hash || '').slice(1));
    show(role ? 'choice' : 'cover');
  }
})();
</script>
